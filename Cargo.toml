[package]
name = "gridedge-t"
version = "0.2.1"
edition = "2021"
default-run = "gridedge"
description = "Auditable event-sourced A-share grid trading research infrastructure"
license = "MIT"

[[bin]]
name = "gridedge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["form"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
crc32fast = "1.4"
flate2 = "1.0"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.14"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true

[dev-dependencies]
proptest = "1.6"
