listener 8883 0.0.0.0
protocol mqtt
listener_allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/acl

cafile /mosquitto/config/tls/ca.crt
certfile /mosquitto/config/tls/server.crt
keyfile /mosquitto/config/tls/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30
autosave_on_changes true

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

max_packet_size 1048576
max_inflight_messages 100
max_queued_messages 200000

# Browser collectors use MQTT 5 over WebSocket on the trusted LAN. The same
# publish-only ACL and password database apply; this listener is intentionally
# not exposed outside the NAS LAN/firewall.
listener 9001 0.0.0.0
protocol websockets
listener_allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/acl
