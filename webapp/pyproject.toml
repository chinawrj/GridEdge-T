[project]
name = "gridedge-web"
version = "0.2.1"
description = "Reactive Python web layer for the GridEdge Rust core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "nicegui>=2.15,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "playwright>=1.54,<2",
    "pytest>=8,<9",
]

[project.scripts]
gridedge-web = "gridedge_web.app:main"
gridedge-platform = "gridedge_web.launcher:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridedge_web*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
